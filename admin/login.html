<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | The2Sellers.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">The2Sellers<span>.io</span></div>
    <div class="sub">FBA Marketplace — Team Login</div>
    <div id="msgArea"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
  </div>
</div>

<script src="/admin/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msgArea = document.getElementById('msgArea');
  msgArea.innerHTML = '';

  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Login failed');

    setSession(body.token, body.user);
    window.location.href = '/admin/index.html';
  } catch (err) {
    msgArea.innerHTML = '<div class="msg msg-error">' + escapeHtml(err.message) + '</div>';
  }
});

// If already logged in, skip straight to the dashboard
if (getToken()) window.location.href = '/admin/index.html';
</script>
</body>
</html>

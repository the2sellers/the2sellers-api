<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog | The2Sellers.io Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>

<div class="page">
  <div class="page-header">
    <h1>Blog</h1>
    <a href="/admin/blog-post.html" class="btn btn-primary">+ New Post</a>
  </div>

  <div class="tabs" id="tabs">
    <a class="tab" data-status="">All</a>
    <a class="tab" data-status="draft">Drafts</a>
    <a class="tab" data-status="published">Published</a>
  </div>

  <div id="listWrap"></div>
</div>

<script src="/admin/app.js"></script>
<script>
if (requireAuthOrRedirect()) {
  renderTopbar('blog');

  const params = new URLSearchParams(window.location.search);
  let currentStatus = params.get('status') || '';

  function setActiveTab() {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.getAttribute('data-status') === currentStatus);
      const s = t.getAttribute('data-status');
      t.href = '/admin/blog.html' + (s ? '?status=' + s : '');
    });
  }

  async function load() {
    setActiveTab();
    const listWrap = document.getElementById('listWrap');
    listWrap.innerHTML = '<div class="empty-state">Loading…</div>';
    try {
      const query = currentStatus ? '?status=' + encodeURIComponent(currentStatus) : '';
      const posts = await apiFetch('/admin/blog-posts' + query);

      if (posts.length === 0) {
        listWrap.innerHTML = '<div class="empty-state"><div class="icon">§</div>No posts yet. Click "New Post" to write your first one.</div>';
        return;
      }

      listWrap.innerHTML = posts.map(p => `
        <a class="listing-row" href="/admin/blog-post.html?id=${p.id}" style="grid-template-columns: 2fr 1fr 1fr auto; text-decoration:none;">
          <div>
            <div class="title">${escapeHtml(p.title)}</div>
            <div class="sub">${escapeHtml(p.author || '—')} · /${escapeHtml(p.slug)}</div>
          </div>
          <div><div class="field-label">Updated</div><div class="field-value">${timeAgo(p.updated_at)}</div></div>
          <div><div class="field-label">${p.status === 'published' ? 'Published' : 'Created'}</div><div class="field-value">${timeAgo(p.status === 'published' ? p.published_at : p.created_at)}</div></div>
          <div><span class="badge badge-${p.status === 'published' ? 'published' : 'pending'}">${p.status}</span></div>
        </a>
      `).join('');
    } catch (err) {
      listWrap.innerHTML = '<div class="msg msg-error">' + escapeHtml(err.message) + '</div>';
    }
  }

  document.getElementById('tabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    e.preventDefault();
    currentStatus = tab.getAttribute('data-status');
    history.pushState({}, '', tab.href);
    load();
  });

  load();
}
</script>
</body>
</html>

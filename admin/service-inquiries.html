<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Inquiries | The2Sellers.io Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>

<div class="page">
  <div class="page-header"><h1>Service Inquiries</h1></div>

  <div class="tabs" id="tabs">
    <a class="tab" data-type="">All</a>
    <a class="tab" data-type="ppc_audit">PPC Audit</a>
    <a class="tab" data-type="listing_optimizer">Listing Optimizer</a>
    <a class="tab" data-type="account_management">Account Management</a>
    <a class="tab" data-type="general_contact">Contact Form</a>
  </div>

  <div id="listWrap"></div>
</div>

<script src="/admin/app.js"></script>
<script>
if (requireAuthOrRedirect()) {
  renderTopbar('service-inquiries');

  const LABELS = {
    ppc_audit: 'PPC Audit', listing_optimizer: 'Listing Optimizer',
    account_management: 'Account Management', general_contact: 'Contact Form'
  };

  const params = new URLSearchParams(window.location.search);
  let currentType = params.get('type') || '';

  function setActiveTab() {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.getAttribute('data-type') === currentType);
      const type = t.getAttribute('data-type');
      t.href = '/admin/service-inquiries.html' + (type ? '?type=' + type : '');
    });
  }

  async function load() {
    setActiveTab();
    const listWrap = document.getElementById('listWrap');
    listWrap.innerHTML = '<div class="empty-state">Loading…</div>';
    try {
      const query = currentType ? '?service_type=' + encodeURIComponent(currentType) : '';
      const rows = await apiFetch('/admin/service-inquiries' + query);

      if (rows.length === 0) {
        listWrap.innerHTML = '<div class="empty-state"><div class="icon">§</div>Nothing here yet.</div>';
        return;
      }

      listWrap.innerHTML = rows.map(r => `
        <div class="listing-row" style="grid-template-columns: 1fr 1.3fr 1fr 1fr auto;">
          <div><span class="badge badge-in_review">${escapeHtml(LABELS[r.service_type] || r.service_type)}</span></div>
          <div>
            <div class="title">${escapeHtml(r.full_name)}</div>
            <div class="sub">${escapeHtml(r.email)} ${r.phone ? '· ' + escapeHtml(r.phone) : ''}</div>
          </div>
          <div><div class="field-label">WhatsApp</div><div class="field-value">${escapeHtml(r.whatsapp || '—')}</div></div>
          <div><div class="field-label">Received</div><div class="field-value">${timeAgo(r.submitted_at)}</div></div>
          <div style="max-width:260px; font-size:12.5px; color:var(--slate); white-space:pre-wrap;">${escapeHtml(r.details || '—')}</div>
        </div>
      `).join('');
    } catch (err) {
      listWrap.innerHTML = '<div class="msg msg-error">' + escapeHtml(err.message) + '</div>';
    }
  }

  document.getElementById('tabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    e.preventDefault();
    currentType = tab.getAttribute('data-type');
    history.pushState({}, '', tab.href);
    load();
  });

  load();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buyer Inquiries | The2Sellers.io Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>

<div class="page">
  <div class="page-header"><h1>Buyer Inquiries</h1></div>
  <div id="listWrap"></div>
</div>

<script src="/admin/app.js"></script>
<script>
if (requireAuthOrRedirect()) {
  renderTopbar('inquiries');

  async function load() {
    const listWrap = document.getElementById('listWrap');
    try {
      const inquiries = await apiFetch('/admin/buyer-inquiries');
      if (inquiries.length === 0) {
        listWrap.innerHTML = '<div class="empty-state"><div class="icon">§</div>No buyer inquiries yet.</div>';
        return;
      }
      listWrap.innerHTML = inquiries.map(b => `
        <div class="listing-row" style="grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;">
          <div>
            <div class="title">${escapeHtml(b.buyer_name)}</div>
            <div class="sub">${escapeHtml(b.buyer_email)} ${b.buyer_phone ? '· ' + escapeHtml(b.buyer_phone) : ''}</div>
          </div>
          <div><div class="field-label">Marketplaces</div><div class="field-value">${escapeHtml(b.desired_marketplaces || '—')}</div></div>
          <div><div class="field-label">Budget</div><div class="field-value">${escapeHtml(b.budget || '—')}</div></div>
          <div><div class="field-label">Timeline</div><div class="field-value">${escapeHtml(b.timeline || '—')}</div></div>
          <div><div class="field-label">Received</div><div class="field-value">${timeAgo(b.submitted_at)}</div></div>
        </div>
      `).join('');
    } catch (err) {
      listWrap.innerHTML = '<div class="msg msg-error">' + escapeHtml(err.message) + '</div>';
    }
  }

  load();
}
</script>
</body>
</html>
